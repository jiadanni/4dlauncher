// Top-level build file where you can add configuration options common to all sub-projects/modules.

import java.text.SimpleDateFormat

buildscript {
    ext {
        version_gradle_tools = "8.3.0"
        version_plugin_kotlin = "1.9.22"
        enable_plugin_kotlin = true

        version_compileSdk = 35
        version_buildTools = "35.0.0"
        version_minSdk = 21

        // https://developer.android.com/jetpack/androidx/releases
        version_library_appcompat = "1.7.0"
        version_library_recyclerview = "1.3.2"
        version_library_cardview = "1.0.0"
        version_library_design = "1.12.0"
        version_library_preference = "1.2.1"
        version_library_constraintlayout = "2.1.4"
        // https://github.com/JakeWharton/butterknife/releases
        version_library_butterknife = "10.2.3"
        // https://github.com/guardianproject/NetCipher/releases
        version_library_netcipher = "2.0.0-alpha1"
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${version_gradle_tools}"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        if (project.enable_plugin_kotlin) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${version_plugin_kotlin}"
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
